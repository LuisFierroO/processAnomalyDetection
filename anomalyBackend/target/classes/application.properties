spring.datasource.url=jdbc:h2:mem:anomalydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8080

# Agent integration
agent.binary.path=./src/main/resources/anomaly_detection_agent
agent.interval-ms=500
agent.enabled=true

# Rolling window — keep last N analysis cycles in memory
retention.max-cycles=10
